; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_dir = C:/pio-build/xiaozhi/${PIOENV}
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = csv/esp_sr_16.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	tzapu/WiFiManager@2.0.17
	bblanchon/ArduinoJson@7.4.3
	olikraus/U8g2@2.36.18
	https://github.com/chenxyon/Max98357Amp.git#v1.0.0

build_flags = 
	-DBOARD_HAS_PSRAM
	-DLOG_LOCAL_LEVEL=3
	-DUSE_ESP_IDF_LOG
	-DCORE_DEBUG_LEVEL=3
	-DLOG_DEFAULT_LEVEL=3
	-DLOG_MAXIMUM_LEVEL=5
	-DKWS_ENABLE=0
	-DAUDIO_AMP_ENABLE=0
	-DAUDIO_MIC_ENABLE=1
	-IC:/Users/18916/.platformio/packages/framework-arduinoespressif32-esp32s3-libs/include/espressif__esp-sr/include/esp32s3
	-IC:/Users/18916/.platformio/packages/framework-arduinoespressif32-esp32s3-libs/include/espressif__esp-sr/src/include
	-Isrc
	-Isrc/auth
	-Isrc/bus                 ; event_bus + main_fsm（规则 8/9）
	-Isrc/tts
	-Isrc/audio               ; hpf_filter + audio_output（规则 1 分层）
	-Isrc/display
	-Isrc/flash
	-Isrc/board
	-Isrc/wake
	-Ilib/cjson
	-Ilib/tts_phrases/cache
	-Ilib/OledU8g2            ; oled_u8g2.cpp 包装层需要
	-Ilib/DisplayIface        ; OledU8g2.hpp 需要 (IDisplay, oled_types.h)

